name: Deploy Frontend Dev

on:
  push:
    branches:
      - frontend-dev
  workflow_dispatch:

concurrency:
  group: frontend-dev-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy frontend dev EC2
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Configure SSH key
        env:
          FRONTEND_DEV_SSH_KEY: ${{ secrets.FRONTEND_DEV_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$FRONTEND_DEV_SSH_KEY" > ~/.ssh/frontend-dev
          chmod 600 ~/.ssh/frontend-dev

      - name: Add EC2 host key
        env:
          FRONTEND_DEV_HOST: ${{ secrets.FRONTEND_DEV_HOST }}
        run: |
          set -euo pipefail
          ssh-keyscan -H "$FRONTEND_DEV_HOST" >> ~/.ssh/known_hosts

      - name: Deploy apps
        env:
          FRONTEND_DEV_HOST: ${{ secrets.FRONTEND_DEV_HOST }}
          FRONTEND_DEV_SSH_USER: ${{ secrets.FRONTEND_DEV_SSH_USER || 'ubuntu' }}
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_API_URL: ${{ secrets.DEV_NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.DEV_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # Server-side only. Gates the job-board admin API and is read exclusively
          # inside apps/console/app/api/job-board/[...path]/route.ts, which runs on
          # the server — so it never reaches the browser bundle. MUST match the
          # backend's ADMIN_API_TOKEN or the Job sources tab returns 503.
          DEV_ADMIN_API_TOKEN: ${{ secrets.DEV_ADMIN_API_TOKEN }}
          # Base URL the console's route handler calls server-to-server. Falls back
          # to the public URL when unset.
          DEV_BACKEND_API_URL: ${{ secrets.DEV_BACKEND_API_URL }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/frontend-dev "$FRONTEND_DEV_SSH_USER@$FRONTEND_DEV_HOST" \
            "FRONTEND_BRANCH=frontend-dev GITHUB_TOKEN='$GITHUB_TOKEN' NEXT_PUBLIC_API_URL='$NEXT_PUBLIC_API_URL' NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY='$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY' DEV_ADMIN_API_TOKEN='${DEV_ADMIN_API_TOKEN:-}' DEV_BACKEND_API_URL='${DEV_BACKEND_API_URL:-}' bash -s" <<'REMOTE'
          set -euo pipefail

          REPO_URL="https://github.com/bhuvan777/talent-platform-ui.git"
          APP_DIR="/opt/brynzit/talent-platform-ui"
          PNPM_HOME="/home/ubuntu/.local/share/pnpm"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"

          sudo apt-get update
          sudo apt-get install -y ca-certificates curl git

          if ! command -v node >/dev/null 2>&1; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi

          sudo corepack enable
          sudo corepack prepare pnpm@11.6.0 --activate

          sudo mkdir -p /opt/brynzit
          sudo chown -R "$USER:$USER" /opt/brynzit

          if [ ! -d "$APP_DIR/.git" ]; then
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" clone "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch origin "$FRONTEND_BRANCH"
          git checkout "$FRONTEND_BRANCH"
          git reset --hard "origin/$FRONTEND_BRANCH"

          cat > apps/web/.env.production <<EOF
          NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
          NEXT_PUBLIC_API_MOCKING=disabled
          EOF

          CONSOLE_BACKEND_URL="${DEV_BACKEND_API_URL:-}"
          CONSOLE_ADMIN_TOKEN="${DEV_ADMIN_API_TOKEN:-}"

          # Empty on purpose: the browser bundle calls same-origin /api/v1/*,
          # which next.config.ts rewrites server-side to BACKEND_API_URL. Keeps
          # the staff session cookie same-site even though the console and
          # backend live on separate EC2 hosts here — see next.config.ts.
          cat > apps/console/.env.production <<EOF
          NEXT_PUBLIC_API_URL=
          NEXT_PUBLIC_API_MOCKING=disabled
          BACKEND_API_URL=${CONSOLE_BACKEND_URL:-$NEXT_PUBLIC_API_URL}
          ADMIN_API_TOKEN=$CONSOLE_ADMIN_TOKEN
          EOF
          chmod 600 apps/console/.env.production

          if [ -z "$CONSOLE_ADMIN_TOKEN" ]; then
            echo "WARNING: DEV_ADMIN_API_TOKEN secret is not set."
            echo "  The console will deploy and every other tab will work, but"
            echo "  Admin -> Job sources will return 503 until this secret is added"
            echo "  and matches the backend's ADMIN_API_TOKEN."
          fi

          pnpm install --frozen-lockfile

          # Next.js's .next/cache can reuse a previous build's NEXT_PUBLIC_*
          # inlining even when .env.production changed, silently shipping a
          # stale client bundle. Force a clean build every deploy.
          rm -rf apps/web/.next apps/console/.next
          pnpm --filter @brynzit/web build

          # NEXT_PUBLIC_API_URL is exported for this whole remote shell (apps/web
          # needs the real absolute URL) — an already-set process env var beats
          # .env.production in Next's own precedence order, so without this
          # override the console's build would silently re-inherit the real
          # backend URL instead of the empty value meant to activate its
          # same-origin proxy (next.config.ts). Override it empty for this one
          # command only; apps/web above is unaffected.
          NEXT_PUBLIC_API_URL= pnpm --filter @brynzit/console build

          sudo tee /etc/systemd/system/brynzit-web.service >/dev/null <<'EOF'
          [Unit]
          Description=Brynzit public web app
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/opt/brynzit/talent-platform-ui/apps/web
          Environment=NODE_ENV=production
          Environment=PNPM_HOME=/home/ubuntu/.local/share/pnpm
          Environment=PATH=/home/ubuntu/.local/share/pnpm:/usr/local/bin:/usr/bin:/bin
          ExecStart=/usr/bin/env bash -lc 'pnpm exec next start -p 3000'
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo tee /etc/systemd/system/brynzit-console.service >/dev/null <<'EOF'
          [Unit]
          Description=Brynzit console app
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/opt/brynzit/talent-platform-ui/apps/console
          Environment=NODE_ENV=production
          Environment=PNPM_HOME=/home/ubuntu/.local/share/pnpm
          Environment=PATH=/home/ubuntu/.local/share/pnpm:/usr/local/bin:/usr/bin:/bin
          ExecStart=/usr/bin/env bash -lc 'pnpm exec next start -p 3001'
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable brynzit-web brynzit-console
          sudo systemctl restart brynzit-web brynzit-console

          sleep 5
          curl -fsS http://localhost:3000 >/dev/null
          curl -fsS http://localhost:3001 >/dev/null
          REMOTE
