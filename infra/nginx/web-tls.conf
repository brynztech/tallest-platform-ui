# talent.trybrynz.com (candidate site) and hire.trybrynz.com (console) over HTTPS.
# Installed by .github/workflows/deploy-frontend-dev.yml as
# /etc/nginx/brynzit-tls/web.conf, only after the certificate exists. Plain http
# on these names answers the certbot challenge and redirects.
server {
    listen 80;
    server_name talent.trybrynz.com hire.trybrynz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name talent.trybrynz.com;

    ssl_certificate     /etc/letsencrypt/live/trybrynz-web/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trybrynz-web/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Next.js and Clerk build absolute URLs and check Origin against these.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Next.js streams pages as they render; buffering would hold them back.
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name hire.trybrynz.com;

    ssl_certificate     /etc/letsencrypt/live/trybrynz-web/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trybrynz-web/privkey.pem;

    # The console sends its API calls (10 MiB resume and JD uploads, LLM-backed
    # requests) through this proxy, so match the backend's caps in api.conf.
    client_max_body_size 12m;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
}
