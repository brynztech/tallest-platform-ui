# The candidate site on the plain IP (port 80) instead of :3000. The named hosts
# (talent.trybrynz.com is the site, hire.trybrynz.com is the console on :3001) are
# served over HTTPS by web-tls.conf, which the deploy installs into
# /etc/nginx/brynzit-tls/ once the certificate exists (a config that names a
# missing certificate fails nginx -t, which would deadlock a fresh host).
# Installed by .github/workflows/deploy-frontend-dev.yml.
server {
    listen 80 default_server;
    server_name _;

    # certbot's HTTP-01 challenge. It also answers for the named hosts until
    # their certificate exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Next.js and Clerk build absolute URLs and check Origin against these.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Next.js streams pages as they render; buffering would hold them back.
        proxy_buffering off;
    }
}

include /etc/nginx/brynzit-tls/*.conf;
