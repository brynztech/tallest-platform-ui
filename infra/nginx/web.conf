# The candidate site on the plain IP (port 80) instead of :3000, and by name:
# talent.trybrynz.com is the site, hire.trybrynz.com is the console (:3001).
# Installed by .github/workflows/deploy-frontend-dev.yml.
server {
    listen 80 default_server;
    server_name talent.trybrynz.com _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Next.js and Clerk build absolute URLs and check Origin against these.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Next.js streams pages as they render; buffering would hold them back.
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name hire.trybrynz.com;

    # The console sends its API calls (10 MiB resume and JD uploads, LLM-backed
    # requests) through this proxy, so match the backend's caps in api.conf.
    client_max_body_size 12m;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
}
