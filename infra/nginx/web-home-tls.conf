# trybrynz.com (homepage) over HTTPS; www redirects to it. The same Next.js app
# as talent.trybrynz.com: apps/web/proxy.ts decides which pages each host shows.
# Installed by .github/workflows/deploy-frontend-dev.yml as
# /etc/nginx/brynzit-tls/home.conf, only after its certificate exists. Until
# then both names fall through to web.conf's default server over plain http.
server {
    listen 80;
    server_name trybrynz.com www.trybrynz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://trybrynz.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.trybrynz.com;

    ssl_certificate     /etc/letsencrypt/live/trybrynz-home/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trybrynz-home/privkey.pem;

    return 301 https://trybrynz.com$request_uri;
}

server {
    listen 443 ssl;
    server_name trybrynz.com;

    ssl_certificate     /etc/letsencrypt/live/trybrynz-home/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trybrynz-home/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
}
